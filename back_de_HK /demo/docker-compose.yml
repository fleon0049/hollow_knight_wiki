services:
  db:
    image: postgres:16-alpine
    container_name: pokemon-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"   # opcional: solo si queres conectarte desde afuera (DBeaver, etc.)
    volumes:
      - db_data:/var/lib/postgresql/data   # los datos sobreviven aunque borres el contenedor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: pokemon-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # espera a que Postgres este listo de verdad
    environment:
      # Dentro de la red de compose, el host de la DB es el nombre del servicio: "db"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # Limita la memoria de la JVM (importante en una PC con poca RAM)
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    ports:
      - "8080:8080"

volumes:
  db_data: