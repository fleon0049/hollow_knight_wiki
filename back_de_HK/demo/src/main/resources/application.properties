spring.application.name=demo

# PostgreSQL local configuration. Los valores por defecto coinciden con .env
# y se pueden reemplazar con variables de entorno al desplegar.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pokemondb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pokemon}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mysecretpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server config
server.port=8080
